<!DOCTYPE html>
<html lang="en" dir="ltr" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Member Login | Emeravita Health Store</title>
  <meta name="description" content="Sign in to your Emeravita account to track orders, refill prescriptions and manage your membership." />
  <meta name="robots" content="noindex, follow" />
  <meta name="theme-color" content="#174F46" />
  <link rel="icon" type="image/png" href="assets/images/emeravita-icon.png" />
  <link rel="apple-touch-icon" href="assets/images/emeravita-icon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;0,9..144,700;1,9..144,600&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <script>
    /* Apply saved theme + direction before first paint (same keys as the home page) */
    (function () {
      var d = document.documentElement, t = null, r = null;
      try { t = localStorage.getItem("careplus-theme"); r = localStorage.getItem("zenora-dir"); } catch (e) {}
      d.setAttribute("data-theme", t === "dark" || t === "light" ? t : (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light"));
      if (r === "rtl" || r === "ltr") d.setAttribute("dir", r);
    })();
  </script>
  <link rel="stylesheet" href="auth.css" />
</head>
<body class="auth-login">

  <!-- Animated background -->
  <div class="auth-bg" aria-hidden="true">
    <span class="blob b1"></span><span class="blob b2"></span><span class="blob b3"></span>
    <svg class="gem gem-1" viewBox="0 0 400 360">
      <path d="M30 130H370M130 40L100 130M130 40L165 130L200 40L235 130L270 40M270 40L300 130M100 130L200 330M165 130L200 330M235 130L200 330M300 130L200 330" opacity=".7"/>
      <path d="M130 40H270L370 130L200 330L30 130Z"/>
      <path class="gem-shine" pathLength="1000" d="M130 40H270L370 130L200 330L30 130Z"/>
    </svg>
    <svg class="gem gem-2" viewBox="0 0 400 360">
      <path d="M30 130H370M130 40L100 130M130 40L165 130L200 40L235 130L270 40M270 40L300 130M100 130L200 330M165 130L200 330M235 130L200 330M300 130L200 330" opacity=".7"/>
      <path d="M130 40H270L370 130L200 330L30 130Z"/>
      <path class="gem-shine" pathLength="1000" d="M130 40H270L370 130L200 330L30 130Z"/>
    </svg>
    <i class="spark sp1"></i><i class="spark sp2"></i><i class="spark sp3"></i>
    <i class="spark sp4"></i><i class="spark sp5"></i><i class="spark sp6"></i>
  </div>

  <!-- RTL + Dark mode (top-right) -->
  <div class="auth-toggles">
    <button class="auth-icon-btn" id="rtlToggle" type="button" aria-pressed="false" aria-label="Switch to right-to-left" title="Switch LTR / RTL">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 8h14m0 0l-4-4m4 4l-4 4M20 16H6m0 0l4-4m-4 4l4 4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
    <button class="auth-icon-btn" id="themeToggle" type="button" aria-pressed="false" aria-label="Switch to dark mode" title="Light / Dark mode">
      <svg class="icon-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12.8A9 9 0 1111.2 3a7 7 0 009.8 9.8z" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <svg class="icon-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4.5" fill="none" stroke="currentColor" stroke-width="2"/><path d="M12 2v2m0 16v2M4.9 4.9l1.4 1.4m11.4 11.4l1.4 1.4M2 12h2m16 0h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
    </button>
  </div>

  <main class="auth-stage" id="authStage">
    <section class="auth-card" aria-labelledby="authTitle">

      <!-- Logo inside the card -->
      <a href="index.html" class="auth-brand stagger" style="--i:0" aria-label="Emeravita Health Store home">
        <span class="auth-logo"><img src="assets/images/emeravita-icon.png" alt="" width="120" height="120" decoding="async" /></span>
        <span class="auth-brand-text">
          <span class="auth-brand-name">Emeravita</span>
          <span class="auth-brand-tag">Wellness, polished like a gem.</span>
        </span>
      </a>

      <h1 class="auth-title stagger" style="--i:1" id="authTitle">Welcome <em>back</em></h1>
      <p class="auth-sub stagger" style="--i:2">Sign in to track orders, refill prescriptions and manage your membership.</p>

      <!-- Other sign-in options -->
      <div class="social-row stagger" style="--i:3">
        <button type="button" class="social-btn" data-provider="Google" aria-label="Sign in with Google">
          <svg viewBox="0 0 48 48" aria-hidden="true">
            <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>
            <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/>
            <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/>
            <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>
          </svg>
          <span>Google</span>
        </button>
        <button type="button" class="social-btn" data-provider="Apple" aria-label="Sign in with Apple">
          <svg viewBox="0 0 384 512" aria-hidden="true"><path fill="currentColor" d="M318.7 268.7c-.2-36.7 16.4-64.4 50-84.8-18.8-26.9-47.2-41.7-84.7-44.6-35.5-2.8-74.3 20.7-88.5 20.7-15 0-49.4-19.7-76.4-19.7C63.3 141.2 4 184.8 4 273.5q0 39.3 14.4 81.2c12.8 36.7 59 126.7 107.2 125.2 25.2-.6 43-17.9 75.8-17.9 31.8 0 48.3 17.9 76.4 17.9 48.6-.7 90.4-82.5 102.6-119.3-65.2-30.7-61.7-90-61.7-91.9zm-56.6-164.2c27.3-32.4 24.8-61.9 24-72.5-24.1 1.4-52 16.4-67.9 34.9-17.5 19.8-27.8 44.3-25.6 71.9 26.1 2 49.9-11.4 69.5-34.3z"/></svg>
          <span>Apple</span>
        </button>
      </div>

      <div class="auth-divider stagger" style="--i:4"><span>or sign in with email</span></div>

      <form class="auth-form" id="loginForm" novalidate>

        <div class="field-group stagger" style="--i:5">
          <div class="field">
            <svg class="field-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2.5"/><path d="M3.5 7l8.5 6 8.5-6"/></svg>
            <input type="email" id="loginEmail" name="email" placeholder=" " autocomplete="email" inputmode="email" required data-rule="email" aria-describedby="loginEmailErr" />
            <label for="loginEmail">Email address</label>
            <span class="field-line" aria-hidden="true"></span>
            <svg class="field-ok" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 12.5l3.2 3.2L17 9"/></svg>
          </div>
          <p class="field-error" id="loginEmailErr"></p>
        </div>

        <div class="field-group stagger" style="--i:6">
          <div class="field has-toggle">
            <svg class="field-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4.5" y="10.5" width="15" height="10" rx="2.5"/><path d="M8 10.5V7.5a4 4 0 018 0v3"/><circle cx="12" cy="15.5" r="1.2"/></svg>
            <input type="password" id="loginPassword" name="password" placeholder=" " autocomplete="current-password" required data-rule="loginPassword" aria-describedby="loginPasswordErr" />
            <label for="loginPassword">Password</label>
            <span class="field-line" aria-hidden="true"></span>
            <button type="button" class="pw-toggle" aria-controls="loginPassword" aria-pressed="false" aria-label="Show password">
              <svg class="eye" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>
              <svg class="eye-off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 3l18 18"/><path d="M10.6 5.1A10.6 10.6 0 0112 5c6.4 0 10 7 10 7a17.7 17.7 0 01-3.2 4.1M6.6 6.6C3.9 8.4 2 12 2 12s3.6 7 10 7a10 10 0 005.4-1.6"/><path d="M9.9 9.9a3 3 0 004.2 4.2"/></svg>
            </button>
          </div>
          <p class="field-error" id="loginPasswordErr"></p>
        </div>

        <!-- Remember me + Forgot password on one line -->
        <div class="form-row stagger" style="--i:7">
          <label class="check">
            <input type="checkbox" id="rememberMe" name="remember" />
            <span class="check-box" aria-hidden="true"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M3.5 8.5l3 3 6-7"/></svg></span>
            Remember me
          </label>
          <button type="button" class="link-btn" id="forgotLink">Forgot password?</button>
        </div>

        <button type="submit" class="auth-cta stagger" style="--i:8">
          <span class="cta-label">Sign In</span>
          <svg class="cta-arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14m-6-6l6 6-6 6"/></svg>
          <span class="cta-spinner" aria-hidden="true"></span>
        </button>

        <p class="form-status" id="loginStatus" role="status" aria-live="polite"></p>
      </form>

      <button type="button" class="demo-fill stagger" style="--i:9" id="demoFill" aria-label="Fill in the demo account: member@emeravita.com, password Emeravita@123">
        <span class="demo-tag">Demo</span>
        <span><b>member@emeravita.com</b> · <b>Emeravita@123</b></span>
      </button>

      <p class="auth-switch stagger" style="--i:10"><bdi>New to Emeravita?</bdi> <a href="signup.html" class="auth-link">Create an account</a></p>
    </section>
  </main>

  <script src="auth.js"></script>
</body>
</html>
